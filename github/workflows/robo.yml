yaml

name: Monitor de Preços 24/7

on:
  schedule:
    # Executa automaticamente a cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Permite que você clique em um botão no site do GitHub para rodar manualmente quando quiser testar!

jobs:
  rodar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas e o navegador Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar o Robô de Preços
        run: python monitor_precos.py
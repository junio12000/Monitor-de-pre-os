name: Monitor de Preços 24/7

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  rodar-robo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Playwright e Navegador
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Executar o Robô de Preços
        env:
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
        run: python monitor_precos.py
